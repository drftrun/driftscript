<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216.51 167.69" color="#ececf0">
  <!--
    The vertical lockup: the caret over the word.

    **The caret is this language's own mark**, the same one the site's favicon and the editor
    extension draw: the compiler pointing at the thing it will not accept. It is not the engine's
    cube, and that difference is the reason this repository exists. Two 45 degree legs meeting at a
    right angle, square caps, mitred join, no curve anywhere; the stroke is a quarter of the width,
    which is the ratio script.driftengine.dev's favicon uses at 32 pixels.

    **No tile behind it.** The marketplace listing carries one because a card draws the mark against
    a gallery's own background, and a README is read on two surfaces. A filled dark block would be a
    hole in one of them.

    The word is outlines and not text, so this file renders identically on a machine with no fonts
    installed and inside a shell with access to none. Drawn from Fira Sans (SIL Open Font License
    1.1) at Light for "Drift" and SemiBold for "Script", at 46 with 0.3 of tracking per
    glyph. The weight break carries the compound word without a space or a capital doing the work,
    and the colour break puts the language's accent on the half that names it. Nothing here is a
    font dependency: no font is embedded, distributed or required. These are curves.

    **The construction is the sibling's, measured from its file and not guessed**, so the two
    lockups are one family: same size, same tracking, same weight break, same currentColor half.
    The engine's is at `packages/package/assets/lockup.svg` in its own repository. What differs is
    the mark and the accent, which is what should differ.

    The caret is centred on the word's width, and the 48.63 under it is the sibling's own gap
    between its mark and the top of its lettering. "Drift" is `currentColor`, so the half that is
    not the accent follows whatever surface this sits on; the root carries the dark default, which
    is what a standalone view or an `img` element gets.
  -->
  <style>
    /* The half that is not the accent follows its surface. A file referenced as an image gets these
       defaults; an inline copy can be overridden by setting `color` on any ancestor. No angle
       brackets in here: this is XML, and a tag name inside a CSS comment is a tag. */
    :root { color: #ececf0; }
    @media (prefers-color-scheme: light) { :root { color: #14141a; } }
  </style>
